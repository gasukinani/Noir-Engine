name: Noir C# Mobile Scripting

# .NET 10 / Android 35+ only. The C# build graph is checked from project metadata, not this workflow text.

on:
  workflow_dispatch:
  push:
    branches: [main, noir-editor-upgrade, noir-editor-v1.2-world-csharp-vulkan, noir-world-environment-quality, noir-v1.3-world-vulkan-csharp]

permissions:
  contents: read

jobs:
  csharp:
    name: Validate Noir C# SDK and mobile project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"

      - name: Verify SDK and target frameworks
        shell: bash
        run: |
          set -euo pipefail
          dotnet --version
          dotnet --info
          echo "Scanning C# project metadata for obsolete Android target declarations..."
          if grep -R --line-number -E 'net[[:space:]]*8[.]0-android' csharp --include='*.csproj' --include='*.props' --include='*.targets' --include='*.xml' --include='*.json'; then
            echo "ERROR: obsolete Android target found in C# project metadata."
            exit 1
          fi

      - name: Install .NET for Android workload
        run: dotnet workload install android --skip-manifest-update

      - name: Verify Android workload
        run: dotnet workload list

      - name: Build authoritative Noir API
        run: dotnet build csharp/Noir.csproj --configuration Release

      - name: Restore compiler host
        run: dotnet restore csharp/Noir.CSharp.Compiler/Noir.CSharp.Compiler.csproj

      - name: Build Roslyn compiler host
        run: dotnet build csharp/Noir.CSharp.Compiler/Noir.CSharp.Compiler.csproj --configuration Release --no-restore

      - name: Build authoritative Noir API
        run: dotnet build csharp/Noir.csproj --configuration Release

      - name: Build mobile C# SDK
        run: dotnet build csharp/Noir.Mobile.Scripting/Noir.Mobile.Scripting.csproj -f net10.0-android36.1 --configuration Release

      - name: Build mobile C# game template
        run: dotnet build csharp/Noir.GameTemplate/Noir.GameTemplate.csproj -f net10.0-android36.1 --configuration Release

      - name: Build Noir.Editor C# tooling
        run: dotnet build csharp/Noir.Editor/Noir.Editor.csproj --configuration Release

      - name: Validate and emit sample C# DLL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/csharp
          dotnet run --project csharp/Noir.CSharp.Compiler/Noir.CSharp.Compiler.csproj --configuration Release -- compile build/csharp/Noir.Game.dll csharp/Noir.GameTemplate/PlayerController.cs
          test -s build/csharp/Noir.Game.dll
          dotnet run --project csharp/Noir.CSharp.Compiler/Noir.CSharp.Compiler.csproj --configuration Release -- build csharp/Noir.GameTemplate build/csharp/Noir.GameTemplate.dll
          test -s build/csharp/Noir.GameTemplate.dll

      - name: Assemble complete C# SDK dependency bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/csharp/sdk
          for dir in csharp/bin/Release/net10.0 csharp/Noir.CSharp.Compiler/bin/Release/net10.0 csharp/Noir.Mobile.Scripting/bin/Release/net10.0 csharp/Noir.GameTemplate/bin/Release/net10.0-android36.1 csharp/Noir.Editor/bin/Release/net10.0; do
            [ -d "$dir" ] || continue
            find "$dir" -maxdepth 1 -type f \( -name '*.dll' -o -name '*.json' -o -name '*.xml' \) -exec cp -f {} build/csharp/sdk/ \;
          done
          cp build/csharp/Noir.Game.dll build/csharp/sdk/Noir.Game.Sample.dll
          cp build/csharp/Noir.GameTemplate.dll build/csharp/sdk/Noir.GameTemplate.Sample.dll
          test -s build/csharp/sdk/Microsoft.CodeAnalysis.dll
          test -s build/csharp/sdk/Microsoft.CodeAnalysis.CSharp.dll
          test -s build/csharp/sdk/Microsoft.CodeAnalysis.CSharp.Workspaces.dll

      - name: Upload generated C# DLLs
        uses: actions/upload-artifact@v4
        with:
          name: noir-csharp-sdk-full
          path: build/csharp/sdk/*
