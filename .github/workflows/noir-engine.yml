name: Noir Engine CI

on:
  workflow_dispatch:
  push:
    branches: [main, noir-editor-upgrade, noir-editor-v1.2-world-csharp-vulkan, noir-world-environment-quality, noir-v1.3-world-vulkan-csharp]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"
      - name: Install .NET Android workload
        run: dotnet workload install android --skip-manifest-update
      - name: Build complete C# SDK bundle for Android
        shell: bash
        run: |
          set -euo pipefail
          dotnet build csharp/Noir.csproj --configuration Release
          dotnet build csharp/Noir.CSharp.Compiler/Noir.CSharp.Compiler.csproj --configuration Release
          dotnet build csharp/Noir.Mobile.Scripting/Noir.Mobile.Scripting.csproj -f net10.0-android36.1 --configuration Release
          dotnet build csharp/Noir.GameTemplate/Noir.GameTemplate.csproj -f net10.0-android36.1 --configuration Release
          dotnet build csharp/Noir.Editor/Noir.Editor.csproj --configuration Release
          mkdir -p build/csharp/sdk
          cp csharp/bin/Release/net10.0/Noir.dll build/csharp/sdk/
          cp csharp/Noir.Mobile.Scripting/bin/Release/net10.0/Noir.Mobile.Scripting.dll build/csharp/sdk/
          cp csharp/Noir.Mobile.Scripting/bin/Release/net10.0-android36.1/Noir.Mobile.Scripting.dll build/csharp/sdk/Noir.Mobile.Scripting.Android.dll
          cp csharp/Noir.GameTemplate/bin/Release/net10.0-android36.1/Noir.Game.dll build/csharp/sdk/
          cp csharp/Noir.Editor/bin/Release/net10.0/Noir.Editor.dll build/csharp/sdk/
          cp csharp/Noir.CSharp.Compiler/bin/Release/net10.0/Noir.CSharp.Compiler.dll build/csharp/sdk/
          for f in csharp/Noir.CSharp.Compiler/bin/Release/net10.0/*.dll csharp/Noir.CSharp.Compiler/bin/Release/net10.0/*.json; do
            [ -f "$f" ] && cp -f "$f" build/csharp/sdk/
          done
          test -s build/csharp/sdk/Noir.dll
          test -s build/csharp/sdk/Noir.Game.dll
          test -s build/csharp/sdk/Noir.CSharp.Compiler.dll
          test -s build/csharp/sdk/Microsoft.CodeAnalysis.dll
          test -s build/csharp/sdk/Microsoft.CodeAnalysis.CSharp.dll

      - name: Verify preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.1.13356709"
      - name: Install Vulkan shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          glslangValidator --version
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      - name: Validate Android toolchain
        run: |
          set -euo pipefail
          echo "Java:"
          java -version
          echo "Gradle:"
          gradle --version
          echo "Android SDK: $ANDROID_SDK_ROOT"
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --list_installed | grep -E "platforms;android-35|build-tools;35.0.0|cmake;3.22.1|ndk;28.1.13356709" || true
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
          test -d "$ANDROID_SDK_ROOT/cmake/3.22.1"
          test -d "$ANDROID_SDK_ROOT/ndk/28.1.13356709"

      - name: Build debug engine app
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Verify debug APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK size: $(du -h "$APK" | cut -f1)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: noir-engine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
