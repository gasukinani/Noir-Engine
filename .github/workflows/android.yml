name: Noir Engine Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - noir-editor-upgrade

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.1.13356709"

      - name: Verify Android SDK
        run: |
          sdkmanager --version
          sdkmanager --list_installed | grep -E "platform-tools|platforms;android-35|build-tools;35.0.0|ndk;28.1.13356709"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Verify Gradle
        run: gradle --version

      - name: Pre-build engine smoke checks
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/cpp/noir_vulkan.cpp
          test -f app/src/main/cpp/noir_gles.cpp
          test -f app/src/main/cpp/noir_graphics.cpp
          test -f app/src/main/cpp/noir_graphics.h
          test -f app/src/main/cpp/noir_theme.cpp
          test -f app/src/main/cpp/noir_world_environment.cpp
          test -f app/src/main/java/com/noir/game/engine/NoirScriptIdeView.java
          test -f app/src/main/java/com/noir/game/engine/NoirViewport.java
          test -f app/src/main/java/com/noir/game/engine/NoirTheme.java
          test -f app/src/main/java/com/noir/game/engine/NoirSurface.java
          test -f app/src/main/java/com/noir/game/engine/NoirVulkanSurface.java
          test -f app/src/main/java/com/noir/game/engine/NoirProjectWorkspace.java
          test -f app/src/main/java/com/noir/game/engine/MainActivity.java
          grep -q 'ensureCSharpLayout' app/src/main/java/com/noir/game/engine/NoirProjectWorkspace.java
          grep -q 'loadProjectScene' app/src/main/java/com/noir/game/engine/MainActivity.java
          grep -q 'vulkanInitialize' app/src/main/java/com/noir/game/engine/NoirNative.java
          grep -q 'VULKAN' app/src/main/java/com/noir/game/engine/NoirEditorView.java
          grep -q 'INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'worldEnvironmentGlesShader' app/src/main/java/com/noir/game/engine/NoirNative.java
          grep -q 'vulkanAttachSurface' app/src/main/java/com/noir/game/engine/NoirNative.java
          grep -q 'graphicsInitialize' app/src/main/java/com/noir/game/engine/NoirNative.java
          grep -q 'NoirGFX' app/src/main/cpp/noir_graphics.cpp
          grep -q 'renderer = noir_gfx' app/src/main/assets/projects/LoftArena/scenes/LoftArena.game
          grep -q 'csharp/Noir.Game' app/src/main/java/com/noir/game/engine/NoirProjectWorkspace.java
          grep -q 'shader_type' app/src/main/java/com/noir/game/engine/NoirScriptIdeView.java
          ! grep -n '\\n[[:space:]]*VkImage' app/src/main/cpp/noir_vulkan.cpp
          echo "Project-open recovery, C# layout, script IDE, network permissions, GLES/Vulkan, and native environment sources verified."

      - name: Build Debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: noir-engine-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
