name: Noir Engine Release

on:
  push:
    branches:
      - "release-v*"

  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build and Sign Noir Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.1.13356709"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == release-v* ]]; then
            VERSION="${GITHUB_REF_NAME#release-v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Noir 3D Game Engine v$VERSION"

      - name: Verify launcher manifest
        shell: bash
        run: |
          grep -q 'android:name=".ProjectManagerActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:exported="true"' app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.MAIN' app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LAUNCHER' app/src/main/AndroidManifest.xml
          echo "Launcher activity verified: ProjectManagerActivity"

      - name: Decode release keystore
        if: ${{ secrets.NOIR_KEYSTORE_B64 != '' }}
        env:
          NOIR_KEYSTORE_B64: ${{ secrets.NOIR_KEYSTORE_B64 }}
        run: |
          echo "$NOIR_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/noir-release.jks"

      - name: Build signed release
        env:
          NOIR_KEYSTORE: ${{ secrets.NOIR_KEYSTORE_B64 != '' && format('{0}/noir-release.jks', runner.temp) || '' }}
          NOIR_STORE_PASSWORD: ${{ secrets.NOIR_STORE_PASSWORD }}
          NOIR_KEY_ALIAS: ${{ secrets.NOIR_KEY_ALIAS }}
          NOIR_KEY_PASSWORD: ${{ secrets.NOIR_KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          echo "APK ready: $APK"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noir-engine-${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "Noir 3D Game Engine v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
