<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noir SS3 Three.js Sample</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071426}
#label{position:fixed;left:14px;top:14px;color:#fff;font:14px sans-serif;z-index:2}
</style>
</head>
<body>
<div id="label">NOIR SS3 SAMPLE • Three.js fallback • not the production renderer</div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x7a8da3,24,120);
scene.background=new THREE.Color(0x3d5878);

const camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,0.05,180);
camera.position.set(18,12,18);
camera.lookAt(0,1,0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9ab6e8,0x38412f,1.4));
const sun=new THREE.DirectionalLight(0xffd3a0,3.2);
sun.position.set(18,24,16);
sun.castShadow=true;
scene.add(sun);

const terrainMat=new THREE.MeshStandardMaterial({color:0x3d5b3a,roughness:0.92,metalness:0.03});
const terrain=new THREE.Mesh(new THREE.BoxGeometry(44,0.7,44),terrainMat);
terrain.position.y=-0.35;
scene.add(terrain);

const rockMat=new THREE.MeshStandardMaterial({color:0x6f675a,roughness:0.92,metalness:0.01});
for(let i=0;i<10;i++){
  const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(1,0),rockMat);
  const a=i*Math.PI*2/10,rad=7+(i%3)*2;
  rock.position.set(Math.cos(a)*rad,0.7,Math.sin(a)*rad);
  rock.scale.set(1.1+(i%2)*0.5,0.7+(i%3)*0.3,1.0);
  scene.add(rock);
}

const treeMat=new THREE.MeshStandardMaterial({color:0x2e6b3b,roughness:0.84});
const trunkMat=new THREE.MeshStandardMaterial({color:0x5b4330,roughness:1});
for(let i=0;i<12;i++){
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.24,2.2,8),trunkMat);
  const crown=new THREE.Mesh(new THREE.ConeGeometry(1.1,2.8,10),treeMat);
  const a=i*Math.PI*2/12,rad=12+(i%3)*1.7;
  const x=Math.cos(a)*rad,z=Math.sin(a)*rad;
  trunk.position.set(x,1.1,z);
  crown.position.set(x,3.0,z);
  scene.add(trunk,crown);
}

const platform=new THREE.Mesh(
  new THREE.BoxGeometry(3.4,2.3,3.4),
  new THREE.MeshStandardMaterial({color:0x536678,roughness:0.46,metalness:0.24})
);
platform.position.y=1.15;
scene.add(platform);

function frame(){
  requestAnimationFrame(frame);
  renderer.render(scene,camera);
}
frame();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
