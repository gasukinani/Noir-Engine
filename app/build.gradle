plugins { id 'com.android.application' }

def noirKeystore = rootProject.file("keystore.properties")
def noirProps = new Properties()
if (noirKeystore.exists()) {
    noirKeystore.withInputStream { noirProps.load(it) }
}

def noirCSharpBundle = rootProject.file("build/csharp/sdk")
def noirCSharpGeneratedAssets = file("$buildDir/generated/noir-csharp-assets")
def noirVulkanGeneratedAssets = file("$buildDir/generated/noir-vulkan-assets")

 tasks.register("prepareNoirVulkanShaders") {
    inputs.dir(file("src/main/cpp/shaders"))
    outputs.dir(noirVulkanGeneratedAssets)
    doLast {
        String compiler = System.getenv("GLSLANG_VALIDATOR") ?: "glslangValidator"
        delete(noirVulkanGeneratedAssets)
        File out = new File(noirVulkanGeneratedAssets, "vulkan")
        out.mkdirs()
        ["noir_forward.vert", "noir_forward.frag"].each { String shader ->
            exec {
                ignoreExitValue = false
                commandLine compiler, "-V", file("src/main/cpp/shaders/$shader").absolutePath,
                        "-o", new File(out, shader + ".spv").absolutePath
            }
        }
    }
}

tasks.register("prepareNoirCSharpAssets") {
    inputs.dir(noirCSharpBundle)
    outputs.dir(noirCSharpGeneratedAssets)
    doLast {
        if (!noirCSharpBundle.isDirectory()) {
            throw new GradleException("Missing C# SDK bundle: $noirCSharpBundle. Build the Noir C# SDK before assembling the APK.")
        }
        def payload = fileTree(noirCSharpBundle) { include("**/*.dll", "**/*.json", "**/*.xml") }.files
        if (payload.isEmpty()) {
            throw new GradleException("C# SDK bundle contains no DLLs: $noirCSharpBundle")
        }
        delete(noirCSharpGeneratedAssets)
        copy {
            from(noirCSharpBundle)
            into(new File(noirCSharpGeneratedAssets, "csharp/sdk"))
            include("**/*.dll", "**/*.json", "**/*.xml")
        }
    }
}

android {
    namespace 'com.noir.game.engine'

    sourceSets {
        main {
            assets.srcDir(noirCSharpGeneratedAssets)
            assets.srcDir(noirVulkanGeneratedAssets)
        }
    }
    compileSdk 35
    ndkVersion "28.1.13356709"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.noir.game.engine'
        minSdk 26
        targetSdk 35
        versionCode 130
        versionName '1.3.0'
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    signingConfigs {
        release {
            def storePath = System.getenv("NOIR_KEYSTORE") ?: noirProps.getProperty("storeFile")
            def storePwd = System.getenv("NOIR_STORE_PASSWORD") ?: noirProps.getProperty("storePassword")
            def keyAliasValue = System.getenv("NOIR_KEY_ALIAS") ?: noirProps.getProperty("keyAlias")
            def keyPwd = System.getenv("NOIR_KEY_PASSWORD") ?: noirProps.getProperty("keyPassword")
            if (storePath && storePwd && keyAliasValue && keyPwd) {
                storeFile file(storePath)
                storePassword storePwd
                keyAlias keyAliasValue
                keyPassword keyPwd
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv("NOIR_KEYSTORE") || noirKeystore.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

tasks.named("preBuild").configure { dependsOn("prepareNoirCSharpAssets", "prepareNoirVulkanShaders") }

dependencies {
    implementation project(':engine')
}
